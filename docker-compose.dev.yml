version: '3.8'

services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/core/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    networks:
      - intellicore-network

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: intellicore_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: intellicore123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    networks:
      - intellicore-network

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - intellicore-network

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - intellicore-network

  # PgAdmin para gestión de BD
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@intellicore.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - intellicore-network

volumes:
  postgres_data:
  redis_data:

networks:
  intellicore-network:
    driver: bridge
